apiVersion: chaos.polygon.io/v1
kind: ChaosScenario
metadata:
  name: example-validator-restart
  description: >
    Example scaffold produced by the author-scenario skill.

    Hypothesis: restarting a single Bor validator (v4, the reserved fault
    target) does not stall consensus on the remaining validators, no
    panics appear in the surviving validators' logs, and after the
    restart completes the chain head converges across the healthy set.

    Demonstrates how to combine a `container_restart` fault with both
    `prometheus` and `log` success criteria.
  tags: [example, container, restart]
  author: author-scenario-skill
  version: "0.1.0"

spec:
  targets:
    - selector:
        type: kurtosis_service
        enclave: "${ENCLAVE_NAME}"
        pattern: "l2-el-4-bor-heimdall-v2-validator"
      alias: bor_4

  duration: 3m
  warmup: 30s
  cooldown: 2m

  preconditions:
    min_validators: 4

  faults:
    - phase: restart_bor_4
      description: "Restart Bor validator 4 (the reserved fault target)"
      target: bor_4
      type: container_restart
      params:
        stagger: 0
        grace_period: 10

  success_criteria:
    # Steady state: healthy validators keep producing through and after
    # the restart. v4 is excluded per CLAUDE.md invariant.
    - name: healthy_validators_continue
      description: 7/8 validators keep producing through the restart
      type: prometheus
      query: min(rate(chain_head_block{job=~"l2-el-[1235678]-bor-heimdall-v2-validator"}[3m]))
      threshold: "> 0"
      critical: true

    # Fault-effectiveness: panic must NOT show up on healthy validators.
    # absence:true => pass when the pattern is NOT found.
    - name: no_panic_on_healthy_validators
      description: No panic in the healthy validators' logs during the restart
      type: log
      pattern: "panic"
      absence: true
      container_pattern: "l2-el-[1235678]-bor-heimdall-v2-validator"
      critical: true

    # Recovery: chain head converges across the healthy set after teardown.
    - name: chain_head_converges
      description: Healthy validators stay within a small block-height window post-restart
      type: prometheus
      query: >
        max(chain_head_block{job=~"l2-el-[1235678]-bor-heimdall-v2-validator"})
        - min(chain_head_block{job=~"l2-el-[1235678]-bor-heimdall-v2-validator"})
      threshold: "< 50"
      critical: true
      post_fault_only: true

  metrics:
    - chain_head_block
    - cometbft_consensus_height
    - up
