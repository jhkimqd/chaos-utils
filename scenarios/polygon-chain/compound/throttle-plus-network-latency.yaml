apiVersion: chaos.polygon.io/v1
kind: ChaosScenario
metadata:
  name: throttle-plus-network-latency
  description: >
    Compound fault: cap Bor write bandwidth via blkio AND inject 2s P2P
    latency on the same validator. Either degradation in isolation is
    survivable; together they may push block-import wall-time over the
    span-rotation threshold (similar to disk-io-plus-network-latency but
    using cgroup-level rate limiting instead of dd contention). Tests
    multiplicative degradation under cgroup-honest write caps.
  tags: [compound, disk, throttle, network, latency]
  author: DevTools
  version: "0.1.0"

spec:
  targets:
    - selector:
        type: kurtosis_service
        enclave: "${ENCLAVE_NAME}"
        pattern: "l2-el-6-bor-heimdall-v2-validator"
      alias: bor_6

  duration: 3m
  warmup: 30s
  cooldown: 1m

  faults:
    - phase: net_latency
      description: 2s Bor P2P latency
      target: bor_6
      type: network
      params:
        latency: 2000
        target_ports: "30303"
        target_proto: tcp,udp

    - phase: throttle_writes
      description: Cap chaindata writes to 8 MiB/s via blkio
      target: bor_6
      type: disk_throttle
      params:
        target_path: "/var/lib/bor/bor/chaindata"
        write_bps: 8388608   # 8 MiB/s

  success_criteria:
    - name: healthy_validators_continue
      description: Healthy validator set produces blocks under the compound fault
      type: prometheus
      query: min(rate(chain_head_block{job=~"l2-el-[1235678]-bor-heimdall-v2-validator"}[3m]))
      threshold: "> 0"
      critical: true

    - name: consensus_continues
      description: Heimdall consensus advances
      type: prometheus
      query: sum(increase(cometbft_consensus_height{job=~"l2-cl-.*-heimdall-v2-bor-validator"}[2m])) or vector(0)
      threshold: "> 0"
      critical: true

    # Observe the fault landed: compound degradation on the targeted validator.
    - name: target_validator_degraded
      description: Compound-faulted validator sync rate is observably slower than healthy peers
      type: prometheus
      query: avg(rate(chain_head_block{job="l2-el-6-bor-heimdall-v2-validator"}[2m])) / clamp_min(avg(rate(chain_head_block{job=~"l2-el-[12358]-bor-heimdall-v2-validator"}[2m])), 0.001)
      threshold: "< 0.9"
      critical: false
      during_fault: true
      post_fault_only: false

    # Observe recovery: target catches up after both faults are torn down.
    - name: target_validator_recovers
      description: Compound-faulted validator resumes normal sync after teardown
      type: prometheus
      query: rate(chain_head_block{job="l2-el-6-bor-heimdall-v2-validator"}[1m])
      threshold: "> 0"
      critical: true
      post_fault_only: true

    - name: no_span_rotation
      description: Compound fault must not trigger span rotation
      type: log
      pattern: "Span rotated due to the current producer's ineffectiveness"
      container_pattern: "heimdall-v2-bor-validator"
      absence: true
      critical: true
      post_fault_only: true

  metrics:
    - chain_head_block
    - cometbft_consensus_height
    - up
